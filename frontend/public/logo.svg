<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <!-- Primary Gradient -->
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    
    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Shadow Filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Icon Container -->
  <g transform="translate(10, 10)">
    <!-- Background Shape -->
    <rect x="0" y="0" width="100" height="100" rx="22" fill="url(#logoGradient)" filter="url(#shadow)"/>
    
    <!-- Document Shape -->
    <path d="M 25 30 L 65 30 L 75 40 L 75 85 C 75 88 72 90 69 90 L 31 90 C 28 90 25 88 25 85 Z" 
          fill="#ffffff" opacity="0.95"/>
    
    <!-- Folded Corner -->
    <path d="M 65 30 L 65 40 L 75 40 Z" fill="#e0e7ff"/>
    
    <!-- Lock Icon -->
    <circle cx="50" cy="55" r="14" fill="#3b82f6"/>
    <circle cx="50" cy="55" r="6" fill="#ffffff"/>
    <rect x="47" y="55" width="6" height="10" rx="2" fill="#ffffff"/>
    
    <!-- Checkmark Badge -->
    <circle cx="78" cy="78" r="14" fill="#10b981" filter="url(#glow)"/>
    <path d="M 72 78 L 76 82 L 84 74" stroke="#ffffff" stroke-width="3" stroke-linecap="round" 
          stroke-linejoin="round" fill="none"/>
  </g>
  
  <!-- Text "DocVault" -->
  <text x="125" y="62" font-family="'Inter', system-ui, -apple-system, sans-serif" 
        font-size="36" font-weight="800" fill="url(#logoGradient)" letter-spacing="-0.5">
    DocVault
  </text>
  
  <!-- Tagline -->
  <text x="128" y="88" font-family="'Inter', system-ui, -apple-system, sans-serif" 
        font-size="11" font-weight="600" fill="#64748b" letter-spacing="2">
    SECURE DOCUMENT PLATFORM
  </text>
</svg>
