[project]
name = "secure-doc-mgmt"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "why", email = "your.email@example.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aioboto3>=15.5.0",
    "aiofiles>=25.1.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "python-magic-bin>=0.4.14",
    "python-multipart>=0.0.32",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
secure-doc-mgmt = "secure_doc_mgmt:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
