services:
  database:
    image: postgres:15-alpine
    container_name: dms_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d

  backend:
    build: ./backend
    container_name: dms_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://admin:secretpassword@database:5432/app_db
    depends_on:
      - database

  frontend:
    build: ./frontend
    container_name: dms_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  db_data: