#version: "3.8" 
#since docker no longer needs to specify the version

services:
  # --- Database Service ---
  postgres:
    image: postgres:17
    container_name: sddms_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/SIH_DATABASE.sql:/docker-entrypoint-initdb.d/01_sih_database.sql
      - ./database/test_database.sql:/docker-entrypoint-initdb.d/02_sih_tables.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-net

  # --- Object Storage Service ---
  minio:
    image: minio/minio:latest
    container_name: sddms_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Antivirus Scanner Service ---
  clamav:
    image: clamav/clamav:latest
    container_name: sddms_clamav
    ports:
      - "3310:3310"
    volumes:
      - clamdata:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc 127.0.0.1 3310"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-net

  # --- Application Backend ---
  backend:
    build: ./backend
    #.env file is also needed in backened folder therefore instead of copying it to backend folder, we can use env_file to load the environment variables from the .env file in the root directory
    env_file:
      - .env
    container_name: dms_backend
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

  # --- Application Frontend ---
  frontend:
    build: ./frontend
    container_name: dms_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL}
    depends_on:
      - backend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  pgdata:
  miniodata:
  clamdata: