version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: dms_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d

  backend:
    build: ./backend
    container_name: dms_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: secretpassword
      DB_NAME: app_db
    depends_on:
      - database

  frontend:
    build: ./frontend
    container_name: dms_frontend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - backend

volumes:
  db_data: