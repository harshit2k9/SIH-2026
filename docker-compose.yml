version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: sddms_postgres
    environment:
      POSTGRES_USER: sddms_user
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: sddms_db
    ports:
      - "5432:5432"
    volumes:
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sddms_user -d sddms_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: sddms_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: change-this-in-production
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  clamav:
    image: clamav/clamav:latest
    container_name: sddms_clamav
    ports:
      - "3310:3310"
    volumes:
      - clamdata:/var/lib/clamav
    # First boot downloads virus DB signatures — can take a few minutes.
    healthcheck:
      test: ["CMD", "sh", "-c", "echo PING | nc localhost 3310"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  miniodata:
  clamdata:
