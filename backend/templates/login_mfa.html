<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        SIH26 Two-Factor Authentication
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px;

            background:
                #f3f4f6;

            font-family:
                Arial,
                sans-serif;

            color:
                #111827;

        }


        .card {

            width:
                430px;

            max-width:
                100%;

            padding:
                40px;

            background:
                white;

            border-radius:
                14px;

            box-shadow:
                0 8px 30px
                rgba(0,0,0,0.1);

            text-align:
                center;

        }


        h1 {
            margin-top: 0;
        }


        .icon {

            font-size:
                42px;

            margin-bottom:
                10px;

        }


        .subtitle {

            color:
                #6b7280;

            line-height:
                1.5;

        }


        input {

            width:
                100%;

            margin-top:
                20px;

            padding:
                15px;

            border:
                1px solid #d1d5db;

            border-radius:
                8px;

            text-align:
                center;

            font-size:
                24px;

            letter-spacing:
                7px;

        }


        input:focus {

            outline:
                none;

            border-color:
                #111827;

        }


        button {

            width:
                100%;

            margin-top:
                20px;

            padding:
                14px;

            border:
                none;

            border-radius:
                8px;

            background:
                #111827;

            color:
                white;

            font-size:
                16px;

            font-weight:
                bold;

            cursor:
                pointer;

        }


        .error {

            margin-top:
                20px;

            padding:
                12px;

            background:
                #fee2e2;

            color:
                #991b1b;

            border-radius:
                7px;

        }

    </style>

</head>


<body>


<div class="card">


    <div class="icon">
        🔐
    </div>


    <h1>

        Two-Factor Authentication

    </h1>


    <p class="subtitle">

        Open Google Authenticator and
        enter the current 6-digit code.

    </p>


    {% if error %}

    <div class="error">

        {{ error }}

    </div>

    {% endif %}


    <form
        action="/login/mfa"
        method="POST"
    >


        <input
            type="hidden"
            name="challenge_token"
            value="{{ challenge_token }}"
        >


        <input
            type="text"
            name="code"
            maxlength="6"
            pattern="[0-9]{6}"
            inputmode="numeric"
            autocomplete="one-time-code"
            placeholder="000000"
            autofocus
            required
        >


        <button type="submit">

            Verify & Sign In

        </button>


    </form>


</div>


</body>

</html>
