<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        SIH26 Login
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px;

            font-family:
                Arial,
                sans-serif;

            background:
                #f3f4f6;

            color:
                #111827;

        }


        .card {

            width:
                430px;

            max-width:
                100%;

            background:
                white;

            padding:
                40px;

            border-radius:
                14px;

            box-shadow:
                0 8px 30px
                rgba(0, 0, 0, 0.1);

        }


        h1 {

            margin-top:
                0;

            margin-bottom:
                5px;

        }


        .subtitle {

            color:
                #6b7280;

            margin-bottom:
                30px;

        }


        label {

            display:
                block;

            margin-top:
                18px;

            margin-bottom:
                7px;

            font-weight:
                600;

        }


        input {

            width:
                100%;

            padding:
                13px;

            border:
                1px solid #d1d5db;

            border-radius:
                7px;

            font-size:
                15px;

        }


        input:focus {

            outline:
                none;

            border-color:
                #111827;

        }


        button {

            width:
                100%;

            margin-top:
                25px;

            padding:
                14px;

            border:
                none;

            border-radius:
                8px;

            background:
                #111827;

            color:
                white;

            font-size:
                16px;

            font-weight:
                bold;

            cursor:
                pointer;

        }


        button:hover {

            background:
                #1f2937;

        }


        .error {

            margin-bottom:
                20px;

            padding:
                12px;

            border-radius:
                7px;

            background:
                #fee2e2;

            color:
                #991b1b;

        }


        .register {

            margin-top:
                25px;

            text-align:
                center;

            color:
                #6b7280;

        }


        a {

            color:
                #2563eb;

            text-decoration:
                none;

        }

    </style>

</head>


<body>


<div class="card">


    <h1>
        Sign In
    </h1>


    <p class="subtitle">

        SIH26 Secure Document
        Management System

    </p>


    {% if error %}

    <div class="error">

        {{ error }}

    </div>

    {% endif %}


    <form
        action="/login"
        method="POST"
    >


        <label>
            Email Address
        </label>


        <input
            type="email"
            name="email"
            autocomplete="username"
            required
        >


        <label>
            Password
        </label>


        <input
            type="password"
            name="password"
            autocomplete="current-password"
            required
        >


        <button type="submit">

            Continue

        </button>


    </form>


    <div class="register">

        Don't have an account?

        <a href="/register">

            Register

        </a>

    </div>


</div>


</body>

</html>
