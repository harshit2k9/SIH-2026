<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        SIH26 Dashboard
    </title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            background:
                #f3f4f6;

            font-family:
                Arial,
                sans-serif;

            color:
                #111827;

        }


        .navbar {

            display:
                flex;

            justify-content:
                space-between;

            align-items:
                center;

            padding:
                18px 30px;

            background:
                #111827;

            color:
                white;

        }


        .brand {

            font-size:
                20px;

            font-weight:
                bold;

        }


        .logout-button {

            padding:
                9px 16px;

            border:
                1px solid #374151;

            border-radius:
                7px;

            background:
                #1f2937;

            color:
                white;

            cursor:
                pointer;

        }


        .page {

            max-width:
                1000px;

            margin:
                auto;

            padding:
                40px 20px;

        }


        .welcome {

            margin-bottom:
                30px;

        }


        .card {

            padding:
                30px;

            background:
                white;

            border-radius:
                14px;

            box-shadow:
                0 5px 20px
                rgba(0,0,0,0.07);

        }


        .verified {

            display:
                inline-block;

            margin-top:
                8px;

            padding:
                7px 12px;

            border-radius:
                20px;

            background:
                #dcfce7;

            color:
                #166534;

            font-weight:
                bold;

            font-size:
                14px;

        }


        .info {

            margin-top:
                25px;

            display:
                grid;

            grid-template-columns:
                1fr 1fr;

            gap:
                20px;

        }


        .field {

            padding:
                18px;

            border:
                1px solid #e5e7eb;

            border-radius:
                9px;

        }


        .label {

            color:
                #6b7280;

            font-size:
                13px;

            margin-bottom:
                5px;

        }


        .value {

            font-weight:
                600;

        }


        @media (
            max-width: 600px
        ) {

            .info {

                grid-template-columns:
                    1fr;

            }

        }

    </style>

</head>


<body>


<div class="navbar">


    <div class="brand">

        SIH26 SecureDocs

    </div>


    <form
        action="/logout"
        method="POST"
    >

        <button
            class="logout-button"
            type="submit"
        >

            Logout

        </button>

    </form>


</div>


<div class="page">


    <div class="welcome">

        <h1>

            Welcome,
            {{ user.full_name }}

        </h1>


        <p>

            You are securely authenticated.

        </p>

    </div>


    <div class="card">


        <h2>
            Account
        </h2>


        <div class="verified">

            ✓ Identity Verified
            &nbsp; · &nbsp;
            ✓ MFA Enabled

        </div>


        <div class="info">


            <div class="field">

                <div class="label">

                    Unique Identification Number

                </div>

                <div class="value">

                    {{ user.user_uid }}

                </div>

            </div>


            <div class="field">

                <div class="label">

                    Account Status

                </div>

                <div class="value">

                    {{ user.registration_status }}

                </div>

            </div>


            <div class="field">

                <div class="label">

                    Name

                </div>

                <div class="value">

                    {{ user.full_name }}

                </div>

            </div>


            <div class="field">

                <div class="label">

                    Email

                </div>

                <div class="value">

                    {{ user.email }}

                </div>

            </div>


        </div>


    </div>


</div>


</body>

</html>
