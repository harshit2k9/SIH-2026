<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        SIH26 Admin Login
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #111827;

            font-family:
                Arial,
                sans-serif;

        }

        .card {

            width: 430px;

            max-width:
                calc(100% - 40px);

            padding: 40px;

            background: white;

            border-radius: 14px;

        }

        h1 {
            margin-top: 0;
        }

        .subtitle {

            color: #6b7280;

            margin-bottom: 30px;

        }

        label {

            display: block;

            margin-top: 18px;

            margin-bottom: 7px;

            font-weight: bold;

        }

        input {

            width: 100%;

            padding: 13px;

            border:
                1px solid #d1d5db;

            border-radius: 7px;

        }

        button {

            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 7px;

            background: #111827;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }

        .error {

            margin-bottom: 20px;

            padding: 12px;

            background: #fee2e2;

            color: #991b1b;

            border-radius: 7px;

        }

    </style>

</head>


<body>


<div class="card">


    <h1>
        Administrator Login
    </h1>


    <p class="subtitle">

        SIH26 Identity Review Console

    </p>


    {% if error %}

    <div class="error">

        {{ error }}

    </div>

    {% endif %}


    <form
        method="POST"
        action="/admin/login"
    >


        <label>
            Admin Email
        </label>


        <input
            type="email"
            name="email"
            required
        >


        <label>
            Password
        </label>


        <input
            type="password"
            name="password"
            required
        >


        <button type="submit">

            Sign In

        </button>


    </form>


</div>


</body>

</html>
